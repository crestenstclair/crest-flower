[project]
name = "push-chord-grid"
version = "0.5.2"
description = "Generated Max for Live MIDI effect for Ableton Push 3"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
